# nginx in front of gunicorn: one hostname, sane upload limits, and a place to
# terminate TLS later. gunicorn binds to localhost only, so nginx is the only
# way in.
server {
    listen 80;
    server_name _;

    # Claim CSV uploads and nothing else are posted here; the default 1m is
    # tight for a large registration-id list.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Processing status is polled, and a fetch can hold a request open
        # while the selection query runs against Redshift.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
